<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HEALTHED 445 M3 | What Should Ms. Rivera Do Next?</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#222;line-height:1.55;background:#f7f6f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:860px;margin:25px auto;background:white;box-shadow:0 5px 24px #25183b16;border-radius:14px;overflow:hidden}.mast{background:#501d82;color:white;padding:26px 32px}.mast small{letter-spacing:.08em}.mast h1{margin:8px 0;font-size:clamp(1.45rem,4vw,2rem);line-height:1.2}.mast p{margin:0;color:#eee3f7}.content{padding:26px 32px}.muted{color:#555}.notice{border-left:4px solid #7c5b9b;background:#f6f4fa;padding:14px 17px;margin:16px 0}.progress{height:9px;background:#e6dfec;border-radius:8px;overflow:hidden}.progress span{display:block;background:#501d82;height:100%;width:0;transition:width .2s}.stephead{display:flex;justify-content:space-between;gap:10px;align-items:center}.eyebrow{font-size:.85rem;font-weight:bold;color:#501d82;text-transform:uppercase;letter-spacing:.04em}h2{font-size:1.45rem;line-height:1.3;margin:16px 0 10px}h3{font-size:1.07rem}.scene{background:#f6f4fa;border-radius:10px;padding:18px;margin:18px 0}.scene p:last-child{margin-bottom:0}.quote{border-left:3px solid #9176ab;padding-left:13px}.choices{display:grid;gap:10px;margin:18px 0}.choice{width:100%;background:white;border:2px solid #d9d4df;border-radius:9px;padding:14px 16px;text-align:left;font:inherit;cursor:pointer;color:#222}.choice:hover,.choice:focus-visible{border-color:#501d82;background:#faf7fc}.choice[aria-pressed=true]{border-color:#501d82;background:#f1eafa}.choice:disabled{cursor:default;opacity:.78}.feedback{border:1px solid #c9b8d8;background:#faf8fc;padding:16px;border-radius:9px;margin:16px 0}.feedback strong{color:#501d82}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.primary,button.secondary{border-radius:8px;padding:12px 17px;font:inherit;font-weight:bold;cursor:pointer}button.primary{background:#501d82;color:white;border:2px solid #501d82}button.secondary{background:white;color:#501d82;border:2px solid #501d82}button:focus-visible{outline:3px solid #8b66ad;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}textarea{display:block;width:100%;min-height:110px;border:2px solid #b9b1c1;border-radius:8px;padding:12px;font:inherit;resize:vertical}label{font-weight:bold;display:block;margin:16px 0 6px}.tiny{font-size:.85rem;color:#555}.hidden{display:none!important}.completion{border:2px solid #501d82;border-radius:12px;padding:22px;background:#faf8fc}.checklist{padding-left:22px}.checklist li{margin:8px 0}@media(max-width:600px){.shell{margin:0;border-radius:0}.content,.mast{padding:20px}.stephead{align-items:flex-start;flex-direction:column}}@media print{body{background:white}.shell{box-shadow:none;margin:0}.actions,.choices,.progress{display:none!important}.content{padding:12px}.mast{print-color-adjust:exact}}
</style></head><body><main class="shell"><header class="mast"><small>HEALTHED 445 · MODULE 3</small><h1>What Should Ms. Rivera Do Next?</h1><p>Teaching Health Skills Through Practice</p></header><div class="content"><div id="app" aria-live="polite"></div></div></main><script>
'use strict';
const KEY='healthed445_m3_microloops_v1';
const loops=[
{label:'Watch & Notice',support:'',title:'Make the decision-making process visible',scene:`<p>Ms. Rivera teaches 26 eighth graders. They can recall disease-prevention practices but struggle to use decision-making when routines or supplies change.</p><p><strong>Case A:</strong> A long handwashing line forms before lunch. Students are concerned about having enough time to eat. A supervising adult is nearby.</p><p><strong>Ms. Rivera models:</strong></p><p class="quote">“We could wait in this line and ask the adult for help with the timing. Or we could ask whether an alternate handwashing station is available. Let's think about what might happen with each choice before deciding.”</p>`,question:'What makes this a useful model for students?',options:[['She makes two responses, possible consequences, and the reasoning process visible.','Yes. The teacher models the thinking students will later need to do themselves.'],['She tells students to wash their hands because it is important.','That content matters, but the example goes further: it makes the decision-making process visible.'],['She asks students to work independently without an example.','Look again: Ms. Rivera demonstrates her reasoning before asking students to try.']],best:0,bridge:'Notice the sequence: identify the decision, consider responses, explain consequences, and justify a feasible choice.'},
{label:'Choose & Explain',support:'',title:'Plan practice with prompts',scene:`<p><strong>Case B:</strong> Before snack, students discover that the soap dispenser is empty. In this fictional school scenario, an adult can request a refill or arrange access to another station.</p><p>Ms. Rivera wants students to practice comparing options with a partner before making an individual decision.</p><div class="notice"><strong>Support still available:</strong> “What are two realistic responses? What could happen with each? Which choice is feasible, and what adult help might be needed?”</div>`,question:'Which guided-practice move best fits the learning goal?',options:[['Tell partners the best response and ask them to repeat it.','This provides an answer, but students do little comparison or justification.'],['Have partners name two responses and consequences, then justify a choice while Ms. Rivera listens and prompts.','Yes. The prompts scaffold the reasoning without doing the work for students.'],['Ask students to memorize a list of disease-prevention rules.','Recall may support the task, but the goal is to use decision-making in a changed situation.']],best:1,bridge:'Guided practice preserves the reasoning task while adding prompts and feedback.'},
{label:'Respond & Revise',support:'',title:'Help a student strengthen their reasoning',scene:`<p>During Case B, a student responds:</p><p class="quote">“We would ask the adult for help because washing hands is important.”</p><p>This identifies a source of support, but the student has not yet compared two realistic responses or explained their consequences.</p>`,question:'Which feedback would best support revision?',options:[['“Correct. Good job.” Then move to the next student.','Encouragement is fine, but the student still needs a specific next step.'],['Explain the complete answer while the student listens.','The explanation could help, but it removes the student’s opportunity to revise their own reasoning.'],['“You identified adult help. Now compare two actions, explain what might happen with each, and revise your choice.”','Yes. This acknowledges a strength, identifies what is missing, and invites the student to revise.']],best:2,bridge:'Effective feedback creates an opportunity for students to improve their own work.'},
{label:'Apply & Adapt',support:'',title:'Check readiness in a changed situation',scene:`<p><strong>Case C:</strong> A room change causes students to miss their usual handwashing stop before lunch. In this fictional school scenario, an adult can arrange a nearby station and adjust timing.</p><p>Students have seen a model and completed guided practice. Ms. Rivera now needs evidence that each student can reason independently.</p>`,question:'What should Ms. Rivera ask students to do next?',options:[['Individually compare two feasible responses, explain a consequence of each using the information card, and justify a choice.','Yes. This gives Ms. Rivera individual evidence of decision-making, with the health-information card still available.'],['Repeat the model aloud as a whole class.','Repetition may reinforce the model, but it does not show whether each student can apply the process independently.'],['Complete a recall quiz about when handwashing matters.','That checks content recall rather than the decision-making performance the lesson targets.']],best:0,bridge:'Independent evidence should match the skill goal: two responses, their consequences, and a feasible justified choice.'}
];
let state={step:0,selected:null,attempts:[0,0,0,0],done:[false,false,false,false],notes:['','','',''],completedAt:null};
try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.done)&&old.done.length===4)state={...state,...old,selected:null}}catch(e){}
const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let finished=state.done.every(Boolean);if(finished){renderFinish();return}let i=state.step,l=loops[i];if(state.done[i]){state.step=state.done.findIndex(v=>!v);i=state.step;l=loops[i]}
let picked=state.selected;app.innerHTML=`<div class="stephead"><span class="eyebrow">Part ${i+1} of 4</span></div><div class="progress" role="progressbar" aria-label="Completed sections" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${state.done.filter(Boolean).length}"><span style="width:${state.done.filter(Boolean).length*25}%"></span></div><h2>${esc(l.title)}</h2><div class="scene">${l.scene}</div><h3>${esc(l.question)}</h3><div class="choices" role="group" aria-label="Instructional decision options">${l.options.map((o,j)=>`<button class="choice" type="button" data-choice="${j}" aria-pressed="${picked===j}" ${picked!==null?'disabled':''}>${esc(o[0])}</button>`).join('')}</div><div id="feedback" ${picked===null?'class="hidden"':'class="feedback"'} role="status">${picked===null?'':feedbackHtml(l,picked)}</div><div class="actions">${picked!==null&&picked!==l.best?'<button class="secondary" id="retry" type="button">Revise my decision</button>':''}${picked===l.best?'<button class="primary" id="next" type="button">'+(i===3?'Complete walkthrough':'Continue')+'</button>':''}</div>`;
app.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.selected=Number(b.dataset.choice);state.attempts[i]++;save();render();document.getElementById('feedback').focus?.()}));let retry=document.getElementById('retry');if(retry)retry.addEventListener('click',()=>{state.selected=null;save();render()});let next=document.getElementById('next');if(next)next.addEventListener('click',()=>{state.done[i]=true;state.selected=null;if(state.done.every(Boolean))state.completedAt=new Date().toISOString();else state.step=state.done.findIndex(v=>!v);save();render();window.scrollTo(0,0)})}
function feedbackHtml(l,picked){return `<strong>${picked===l.best?'Why this works':'Consider the consequence'}</strong><p>${esc(l.options[picked][1])}</p>${picked===l.best?`<p><strong>Take forward:</strong> ${esc(l.bridge)}</p>`:'<p>Review the instructional goal and try a different decision.</p>'}`}
function renderFinish(){app.innerHTML=`<div class="completion"><p class="eyebrow">Walkthrough complete</p><h2>You've completed the knowledge check.</h2><p>You practiced modeling, guided practice, feedback, and independent application using Ms. Rivera’s classroom cases.</p><ol class="checklist">${loops.map(l=>`<li>${esc(l.label)} — complete</li>`).join('')}</ol><p><strong>Next:</strong> Continue to <em>Show Us How You'd Teach It</em>, then use that thinking in your <em>Skill-Teaching Sequence & Method Rationale</em> Toolkit assignment.</p><p class="tiny">Completion is not automatically sent to Canvas.</p><div class="actions"><button class="primary" id="download" type="button">Download completion record</button><button class="secondary" id="print" type="button">Print / Save PDF</button><button class="secondary" id="restart" type="button">Restart practice</button></div></div>`;
document.getElementById('download').addEventListener('click',()=>{let txt=['HEALTHED 445 - M3 Interactive Knowledge Check','What Should Ms. Rivera Do Next?','Completed: '+state.completedAt,'Sections: '+loops.map(l=>l.label).join('; '),'Attempts per loop: '+state.attempts.join(', '),'This is a self-generated local completion record, not Canvas verification.'].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='HEALTHED445_M3_completion_record.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.getElementById('print').addEventListener('click',()=>window.print());document.getElementById('restart').addEventListener('click',()=>{if(confirm('Restart this knowledge check? This clears the saved completion record on this browser.')){state={step:0,selected:null,attempts:[0,0,0,0],done:[false,false,false,false],notes:['','','',''],completedAt:null};save();render()}})}
render();
</script></body></html>
