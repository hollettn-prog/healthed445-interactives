<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M1 Knowledge Check: Beyond the Facts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#24242b;font:17px/1.6 Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:24px auto;background:#fff;border:1px solid #e9e9ee;border-radius:12px;overflow:hidden}.head{background:#4f2d7f;background:linear-gradient(135deg,#34204f,#7654a3);color:white;padding:28px 30px}.head small{font-size:14px;letter-spacing:.04em}.head h1{font-size:28px;line-height:1.25;margin:8px 0 0;color:white}.head p{margin:5px 0 0}.content{padding:28px 30px 34px}.intro{background:#f7f7f9;padding:16px 20px;border-radius:7px;margin:0 0 22px}.step{color:#4f2d7f;font-weight:700;font-size:14px}.bar{height:9px;background:#e9e9ee;border-radius:20px;overflow:hidden;margin:9px 0 24px}.bar span{display:block;height:100%;background:#7654a3;transition:width .2s}.content h2{font-size:22px;line-height:1.3;color:#4f2d7f;margin:0 0 14px}.question{font-weight:700;margin:22px 0 12px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:white;border:1.5px solid #bcb4c8;border-radius:9px;padding:13px 15px;font:inherit;color:#24242b;cursor:pointer}.choice:hover:not(:disabled){background:#eee8f5;border-color:#4f2d7f}.choice:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #7654a3;outline-offset:3px}.choice:disabled{cursor:default}.choice.chosen{border-color:#4f2d7f;background:#eee8f5}.feedback{background:#eee8f5;border-left:4px solid #4f2d7f;padding:15px 18px;margin-top:18px;border-radius:4px}.feedback p{margin:5px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.action{font:700 16px Arial,sans-serif;padding:12px 18px;border-radius:8px;cursor:pointer;border:1px solid #4f2d7f;background:#4f2d7f;color:white}button.action.secondary{background:white;color:#4f2d7f}.small{font-size:14px;color:#4c4654}.success{border:1px solid #e9e9ee;padding:20px;border-radius:10px}.status{font-size:14px;margin-top:16px;color:#4c4654}.willie{border-left:4px solid #7654a3;background:#eee8f5;padding:12px 16px;margin:24px 0 0;border-radius:5px}.willie strong{color:#34204f}.up-next{text-align:center;border-top:2px solid #4f2d7f;margin-top:26px;padding-top:18px}.up-next .eyebrow{color:#4f2d7f;font-weight:700;font-size:14px;margin:0 0 4px}.up-next p{margin:0}.up-next a{color:#4f2d7f;text-decoration:underline;font-weight:700}@media(max-width:600px){.wrap{margin:0;border:0;border-radius:0}.head,.content{padding:20px}.head h1{font-size:24px}}@media(prefers-reduced-motion:reduce){.bar span{transition:none}}@media print{.actions{display:none}.wrap{border:0}}
</style></head><body><main class="wrap"><header class="head"><small>HEALTHED 445 &bull; MODULE 1</small><h1>Beyond the Facts</h1><p>Knowledge Check</p></header><section class="content" id="app" aria-label="Knowledge check"></section></main>
<script>
const DATA={"module":1,"title":"Beyond the Facts","intro":"Two fictional Grade 8 lessons share the goal of evaluating a health claim using supplied source details. Lesson A teaches credibility terms and collects definitions. Lesson B models an evaluation, guides comparison, and asks each learner to justify a judgment about a new claim.","parts":[["Spot the gap","Lesson A collects definitions of credibility terms. What is missing?",["More explanation of credibility vocabulary","A chance to apply criteria to a claim","More examples for students to copy","A confidence survey before the definitions"],1,"Knowing terms does not show whether learners can evaluate a claim."],["Check individual evidence","The goal is to evaluate a health claim using source details. Which individual task fits?",["Rate confidence in evaluating sources","Explain the teacher’s supplied judgment","List three credibility criteria","Judge a new claim and explain source evidence"],3,"A new judgment and explanation reveal each learner’s evaluation."],["Improve the lesson","You can revise one segment of Lesson A. What would strengthen it?",["Add modeled evaluation, guided practice, and a new individual check","Add more definitions with illustrations","Ask groups to make a credibility poster","Show finished evaluations for students to copy"],0,"A model and supported attempt prepare students for an individual performance."],["Preserve the goal","A learner struggles to read the supplied source. What support preserves evaluation?",["Replace evaluation with key-term matching","Use a pair’s joint answer as individual evidence","Read the source aloud and collect the learner’s own reasoning","Provide a completed evaluation as the response template"],2,"Access can change while the learner still makes and explains the judgment."]],"wrong":["This option may contribute something, but it does not provide the strongest evidence of the target skill.","Consider whether this move lets each learner do the reasoning rather than only observe or recall.","Think about what the teacher could learn from the student response and how it would guide instruction.","The response should preserve access and the intended skill rather than substitute a different task."]};
const KEY='healthed445_m'+DATA.module+'_walkthrough_v2';
const scorm=(()=>{let api=null,initialized=false;function locate(w){try{for(let n=0;w&&n<12;n++){if(w.API)return w.API;if(w===w.parent)break;w=w.parent}}catch(e){}return null}function init(){try{api=locate(window)||(window.opener?locate(window.opener):null);if(!api)return;initialized=api.LMSInitialize('')==='true';if(initialized){const st=api.LMSGetValue('cmi.core.lesson_status');if(!st||st==='not attempted')api.LMSSetValue('cmi.core.lesson_status','incomplete');api.LMSCommit('')}}catch(e){}}function complete(){if(!initialized)return false;try{api.LMSSetValue('cmi.core.lesson_status','completed');api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','100');api.LMSSetValue('cmi.core.score.raw','100');api.LMSSetValue('cmi.core.exit','');return api.LMSCommit('')==='true'}catch(e){return false}}function close(){if(initialized){try{api.LMSFinish('')}catch(e){}initialized=false}}init();window.addEventListener('pagehide',close);return{complete,available:()=>initialized}})();
let state={step:0,picked:null,done:[false,false,false,false],attempts:[0,0,0,0]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.done)&&saved.done.length===4)state=saved}catch(e){}
const root=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){if(state.done.every(Boolean)){renderFinish();return}let i=state.done.findIndex(v=>!v);state.step=i;const p=DATA.parts[i];const pct=state.done.filter(Boolean).length*25;root.innerHTML=`<div class="step">Part ${i+1} of 4</div><div class="bar" role="progressbar" aria-label="Parts completed" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${pct/25}"><span style="width:${pct}%"></span></div><h2>${p[0]}</h2><p class="intro">${DATA.intro}</p><p class="question">${p[1]}</p><div class="choices" role="group" aria-label="Choose an instructional decision">${p[2].map((s,j)=>`<button type="button" class="choice ${state.picked===j?'chosen':''}" data-choice="${j}" ${state.picked!==null?'disabled':''}>${s}</button>`).join('')}</div><div id="feedback" aria-live="polite">${state.picked===null?'':feedback(p,state.picked)}</div><div class="actions">${state.picked!==null&&state.picked!==p[3]?'<button type="button" class="action secondary" id="retry">Try another response</button>':''}${state.picked===p[3]?`<button type="button" class="action" id="next">${i===3?'Complete Knowledge Check':'Continue'}</button>`:''}</div><aside class="willie"><strong>Willie’s teaching tip</strong><p style="margin:4px 0 0">What would the student's own response tell you about their ability to use the skill?</p></aside>`;root.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.picked=Number(b.dataset.choice);state.attempts[i]++;save();render()}));root.querySelector('#retry')?.addEventListener('click',()=>{state.picked=null;save();render()});root.querySelector('#next')?.addEventListener('click',()=>{state.done[i]=true;state.picked=null;save();if(state.done.every(Boolean))scorm.complete();render();window.scrollTo(0,0)})}
function feedback(p,j){const good=j===p[3];return `<div class="feedback" role="status"><strong>${good?'Why this works':'Consider the learning goal'}</strong><p>${good?p[4]:DATA.wrong[j%DATA.wrong.length]}</p>${good?'':'<p>Review what learners need to demonstrate, then try another response.</p>'}</div>`}
function renderFinish(){const reported=scorm.complete();root.innerHTML=`<div class="success"><h2>Knowledge Check complete</h2><p>You have finished all four parts. Continue to the module discussion and Toolkit assignment.</p><p class="status" role="status">${scorm.available()?(reported?'Completion reported to the course player.':'Completion reporting was attempted. Return to Canvas and verify the assignment status.'):'This browser preview is not connected to Canvas. Complete the SCORM assignment in Canvas to record completion.'}</p><div class="actions"><button type="button" class="action secondary" id="restart">Practice again</button></div></div><div class="up-next"><p class="eyebrow">UP NEXT</p><p><strong>M1 Discussion: When Knowing Isn't Enough</strong></p><p class="small">Return to Canvas Modules to open the discussion.</p></div>`;root.querySelector('#restart').addEventListener('click',()=>{if(confirm('Start this practice again? Your previous Canvas completion will not be undone.')){state={step:0,picked:null,done:[false,false,false,false],attempts:[0,0,0,0]};save();render()}})}
render();
</script></body></html>
