<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M6 Knowledge Check: What Needs to Change?</title><style>*{box-sizing:border-box}body{margin:0;background:#F7F7F9;color:#24242B;font:16px/1.6 Arial,Helvetica,sans-serif}.wrap{max-width:860px;margin:24px auto;background:white;border:1px solid #E9E9EE;border-radius:14px;overflow:hidden}.head{background:#4F2D7F;color:white;padding:26px 30px}.head small{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.head h1{font-size:26px;line-height:1.25;margin:8px 0 0}.content{padding:26px 30px 34px}.intro{background:#EEE8F5;border-left:4px solid #7654A3;padding:15px 18px;border-radius:4px;margin:0 0 22px}.step{color:#4C4654;font-weight:700;font-size:13px}.bar{height:8px;background:#E9E9EE;border-radius:20px;overflow:hidden;margin:9px 0 22px}.bar span{display:block;height:100%;background:#4F2D7F;transition:width .2s}.content h2{font-size:22px;line-height:1.3;color:#4F2D7F;margin:0 0 14px}.question{font-weight:700;margin:22px 0 12px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:white;border:1.5px solid #A79CB5;border-radius:9px;padding:13px 15px;font:inherit;color:#24242B;cursor:pointer}.choice:hover:not(:disabled){background:#EEE8F5;border-color:#4F2D7F}.choice:focus-visible,button:focus-visible{outline:3px solid #7654A3;outline-offset:3px}.choice:disabled{cursor:default}.choice.chosen{border-color:#4F2D7F;background:#EEE8F5}.feedback{background:#EEE8F5;border-left:4px solid #4F2D7F;padding:15px 18px;margin-top:18px;border-radius:4px}.feedback p{margin:5px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.action{font:700 15px Arial,sans-serif;padding:12px 18px;border-radius:8px;cursor:pointer;border:1px solid #4F2D7F;background:#4F2D7F;color:white}button.action.secondary{background:white;color:#4F2D7F}.small{font-size:13px;color:#4C4654}.success{border:1px solid #E9E9EE;padding:20px;border </style></head><body><main class="wrap"><header class="head"><small>HEALTHED 445 · Module 6</small><h1>What Needs to Change?</h1></header><section class="content" id="app"></section><div class="content" style="padding-top:0"><aside class="uww-coach" aria-label="Willie teaching tip"><strong>Willie’s teaching tip</strong><p style="margin:5px 0 0">What evidence from the learner’s response would help you decide what to teach next?</p></aside><nav class="uww-next" aria-label="Next activity"><div class="label">UP NEXT</div><div class="destination">M6 Discussion</div><p style="font-size:14px;margin:6px 0 0">Return to Canvas Modules to open the next activity.</p></nav></div></main><script>const DATA={"module": 6, "title": "What Needs to Change?", "intro": "In a fictional Environmental Health lesson about vehicle idling, learner A claims that a short period of idling can never matter. Learner B gives a justified response and applies it to another situation. Learner C leaves a dense written prompt blank. A supplied information card is the reference for evaluating claims. Twenty minutes remain, then the teacher learns that only six minutes are left.", "parts": [["Separate observation from assumption", "What can the teacher directly conclude about learner C?", ["C needs the content retaught from the beginning", "C needs a reduced reasoning goal", "C submitted no written response; the cause is not yet known", "C has the same misconception as A"], 2, "A blank response is an observation; its cause is still unknown."], ["Check access", "What should the teacher check before reteaching C?", ["Whether a readable or oral prompt elicits the same reasoning", "Whether repeating the same written directions changes the score", "Whether a partner’s answer can stand in for C’s", "Whether factual recall is easier than the intended reasoning"], 0, "Check whether the response format is the barrier before assuming a conceptual gap."], ["Extend appropriately", "Which response fits B’s demonstrated readiness?", ["More examples with no additional reasoning", "A review of definitions B already demonstrated", "Responsibility for completing peers’ work", "A more complex case requiring justified application"], 3, "Extension should deepen the skill rather than add busywork."], ["Use the final six minutes", "What is most useful when only six minutes remain?", ["Explain the original example again for the whole time", "Make a targeted adjustment and collect a brief new individual response", "Use a class confidence vote as the only follow-up", "Collect a copied correction as evidence of transfer"], 1, "A focused adjustment followed by individual evidence informs the next move."]], "wrong": ["This option may contribute something, but it does not provide the strongest evidence of the target skill.", "Consider whether this move lets each learner do the reasoning rather than only observe or recall.", "Think about what the teacher could learn from the student response and how it would guide instruction.", "The response should preserve access and the intended skill rather than substitute a different task."]};
const KEY='healthed445_m'+DATA.module+'_walkthrough_v2';
const scorm=(()=>{let api=null,initialized=false;function locate(w){try{for(let n=0;w&&n<12;n++){if(w.API)return w.API;if(w===w.parent)break;w=w.parent}}catch(e){}return null}function init(){try{api=locate(window)|| (window.opener?locate(window.opener):null);if(!api)return;initialized=api.LMSInitialize('')==='true';if(initialized){const st=api.LMSGetValue('cmi.core.lesson_status');if(!st||st==='not attempted')api.LMSSetValue('cmi.core.lesson_status','incomplete');api.LMSCommit('')}}catch(e){}}function complete(){if(!initialized)return false;try{api.LMSSetValue('cmi.core.lesson_status','completed');api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','100');api.LMSSetValue('cmi.core.score.raw','100');api.LMSSetValue('cmi.core.exit','');return api.LMSCommit('')==='true'}catch(e){return false}}function close(){if(initialized){try{api.LMSFinish('')}catch(e){}initialized=false}}init();window.addEventListener('pagehide',close);return {complete,available:()=>initialized}})();
let state={step:0,picked:null,done:[false,false,false,false],attempts:[0,0,0,0]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.done)&&saved.done.length===4)state=saved}catch(e){}
const root=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){if(state.done.every(Boolean)){renderFinish();return}let i=state.done.findIndex(v=>!v);state.step=i;const p=DATA.parts[i];const pct=state.done.filter(Boolean).length*25;root.innerHTML=`<div class="step">Part ${i+1} of 4</div><div class="bar" role="progressbar" aria-label="Parts completed" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${pct/25}"><span style="width:${pct}%"></span></div><h2>${p[0]}</h2><p class="intro">${DATA.intro}</p><p class="question">${p[1]}</p><div class="choices" role="group" aria-label="Choose an instructional decision">${p[2].map((s,j)=>`<button type="button" class="choice ${state.picked===j?'chosen':''}" data-choice="${j}" ${state.picked!==null?'disabled':''}>${s}</button>`).join('')}</div><div id="feedback" aria-live="polite">${state.picked===null?'':feedback(p,state.picked)}</div><div class="actions">${state.picked!==null&&state.picked!==p[3]?'<button type="button" class="action secondary" id="retry">Try another response</button>':''}${state.picked===p[3]?`<button type="button" class="action" id="next">${i===3?'Complete Knowledge Check':'Continue'}</button>`:''}</div>`;root.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.picked=Number(b.dataset.choice);state.attempts[i]++;save();render()}));root.querySelector('#retry')?.addEventListener('click',()=>{state.picked=null;save();render()});root.querySelector('#next')?.addEventListener('click',()=>{state.done[i]=true;state.picked=null;save();if(state.done.every(Boolean))scorm.complete();render();window.scrollTo(0,0)})}
function feedback(p,j){const good=j===p[3];return `<div class="feedback" role="status"><strong>${good?'Why this works':'Consider the learning goal'}</strong><p>${good?p[4]:DATA.wrong[j%DATA.wrong.length]}</p>${good?'':'<p>Review what learners need to demonstrate, then try another response.</p>'}</div>`}
function renderFinish(){const reported=scorm.complete();root.innerHTML=`<div class="success"><h2>Knowledge Check complete</h2><p>You have finished all four parts. Continue to the module discussion and Toolkit assignment.</p><p class="status" role="status">${scorm.available()?(reported?'Completion reported to the course player.':'Completion reporting was attempted. Return to Canvas and verify the assignment status.'):'This browser preview is not connected to Canvas. Complete the SCORM assignment in Canvas to record completion.'}</p><div class="actions"><button type="button" class="action secondary" id="restart">Practice again</button></div></div>`;root.querySelector('#restart').addEventListener('click',()=>{if(confirm('Start this practice again? Your previous Canvas completion will not be undone.')){state={step:0,picked:null,done:[false,false,false,false],attempts:[0,0,0,0]};save();render()}})}
render();</script></body></html>
