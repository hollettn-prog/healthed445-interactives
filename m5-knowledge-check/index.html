<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M5 Knowledge Check: Will This Lesson Work?</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fa;color:#25212c;font:16px/1.6 Arial,Helvetica,sans-serif}.wrap{max-width:860px;margin:24px auto;background:white;border:1px solid #e5dfea;border-radius:14px;overflow:hidden}.head{background:#501d82;color:white;padding:26px 30px}.head small{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.head h1{font-size:26px;line-height:1.25;margin:8px 0 0}.content{padding:26px 30px 34px}.intro{background:#f6f4fa;border-left:4px solid #8063a3;padding:15px 18px;border-radius:4px;margin:0 0 22px}.step{color:#57476c;font-weight:700;font-size:13px}.bar{height:8px;background:#e9e3f0;border-radius:20px;overflow:hidden;margin:9px 0 22px}.bar span{display:block;height:100%;background:#501d82;transition:width .2s}.content h2{font-size:22px;line-height:1.3;color:#501d82;margin:0 0 14px}.question{font-weight:700;margin:22px 0 12px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:white;border:1.5px solid #bcb4c8;border-radius:9px;padding:13px 15px;font:inherit;color:#25212c;cursor:pointer}.choice:hover:not(:disabled){background:#f6f4fa;border-color:#501d82}.choice:focus-visible,button:focus-visible{outline:3px solid #8555ba;outline-offset:3px}.choice:disabled{cursor:default}.choice.chosen{border-color:#501d82;background:#f6f4fa}.feedback{background:#f6f4fa;border-left:4px solid #501d82;padding:15px 18px;margin-top:18px;border-radius:4px}.feedback p{margin:5px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.action{font:700 15px Arial,sans-serif;padding:12px 18px;border-radius:8px;cursor:pointer;border:1px solid #501d82;background:#501d82;color:white}button.action.secondary{background:white;color:#501d82}.small{font-size:13px;color:#5c5266}.success{border:1px solid #d7ccdf;padding:20px;border-radius:10px}.status{font-size:13px;margin-top:16px;color:#594c64}@media(max-width:600px){.wrap{margin:0;border:0;border-radius:0}.head,.content{padding:20px}.head h1{font-size:23px}}@media print{.actions{display:none}.wrap{border:0}}</style></head><body><main class="wrap"><header class="head"><small>HEALTHED 445 · Module 5</small><h1>Will This Lesson Work?</h1></header><section class="content" id="app"></section></main><script>const DATA={"module": 5, "title": "Will This Lesson Work?", "intro": "A proposed 45-minute Grade 8 Consumer Health source-evaluation lesson includes 35 minutes of teacher explanation, eight minutes of partner comparison, and two minutes of cleanup. The goal is for each learner to judge a new post and justify the choice. No individual response is collected.", "parts": [["Find the alignment gap", "What is the clearest problem with the proposed lesson?", ["There is no vocabulary pretest", "There is no evidence of each learner’s evaluation", "Partner participation is not graded", "The lesson combines teacher and partner work"], 1, "The goal requires individual evaluation, but the plan collects none."], ["Protect the learning goal", "Which revision best addresses that gap?", ["Add a worked example and confidence poll", "Replace partner practice with a longer final task", "Use the partner product to score each learner", "Shorten explanation and reserve time for a new individual judgment"], 3, "Protect time for supported practice and individual evidence."], ["Plan accessible evidence", "Which support preserves the evaluation goal?", ["Readable source cards and an individual oral justification using the same criteria", "A completed evaluation for learners to reproduce", "A shared partner response scored for each learner", "A recall task instead of source evaluation"], 0, "The response format can vary while the evaluation criteria stay intact."], ["Respond when time runs short", "What should guide a time-overrun decision?", ["Finish every teacher explanation and defer evidence", "Keep pair work and infer individual learning", "Retain essential practice and brief individual evidence; trim repetition", "Replace the final judgment with a confidence rating"], 2, "Keep the reasoning and evidence that serve the goal; shorten lower-priority repetition."]], "wrong": ["This option may contribute something, but it does not provide the strongest evidence of the target skill.", "Consider whether this move lets each learner do the reasoning rather than only observe or recall.", "Think about what the teacher could learn from the student response and how it would guide instruction.", "The response should preserve access and the intended skill rather than substitute a different task."]};
const KEY='healthed445_m'+DATA.module+'_walkthrough_v2';
const scorm=(()=>{let api=null,initialized=false;function locate(w){try{for(let n=0;w&&n<12;n++){if(w.API)return w.API;if(w===w.parent)break;w=w.parent}}catch(e){}return null}function init(){try{api=locate(window)|| (window.opener?locate(window.opener):null);if(!api)return;initialized=api.LMSInitialize('')==='true';if(initialized){const st=api.LMSGetValue('cmi.core.lesson_status');if(!st||st==='not attempted')api.LMSSetValue('cmi.core.lesson_status','incomplete');api.LMSCommit('')}}catch(e){}}function complete(){if(!initialized)return false;try{api.LMSSetValue('cmi.core.lesson_status','completed');api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','100');api.LMSSetValue('cmi.core.score.raw','100');api.LMSSetValue('cmi.core.exit','');return api.LMSCommit('')==='true'}catch(e){return false}}function close(){if(initialized){try{api.LMSFinish('')}catch(e){}initialized=false}}init();window.addEventListener('pagehide',close);return {complete,available:()=>initialized}})();
let state={step:0,picked:null,done:[false,false,false,false],attempts:[0,0,0,0]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.done)&&saved.done.length===4)state=saved}catch(e){}
const root=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){if(state.done.every(Boolean)){renderFinish();return}let i=state.done.findIndex(v=>!v);state.step=i;const p=DATA.parts[i];const pct=state.done.filter(Boolean).length*25;root.innerHTML=`<div class="step">Part ${i+1} of 4</div><div class="bar" role="progressbar" aria-label="Parts completed" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${pct/25}"><span style="width:${pct}%"></span></div><h2>${p[0]}</h2><p class="intro">${DATA.intro}</p><p class="question">${p[1]}</p><div class="choices" role="group" aria-label="Choose an instructional decision">${p[2].map((s,j)=>`<button type="button" class="choice ${state.picked===j?'chosen':''}" data-choice="${j}" ${state.picked!==null?'disabled':''}>${s}</button>`).join('')}</div><div id="feedback" aria-live="polite">${state.picked===null?'':feedback(p,state.picked)}</div><div class="actions">${state.picked!==null&&state.picked!==p[3]?'<button type="button" class="action secondary" id="retry">Try another response</button>':''}${state.picked===p[3]?`<button type="button" class="action" id="next">${i===3?'Complete Knowledge Check':'Continue'}</button>`:''}</div>`;root.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.picked=Number(b.dataset.choice);state.attempts[i]++;save();render()}));root.querySelector('#retry')?.addEventListener('click',()=>{state.picked=null;save();render()});root.querySelector('#next')?.addEventListener('click',()=>{state.done[i]=true;state.picked=null;save();if(state.done.every(Boolean))scorm.complete();render();window.scrollTo(0,0)})}
function feedback(p,j){const good=j===p[3];return `<div class="feedback" role="status"><strong>${good?'Why this works':'Consider the learning goal'}</strong><p>${good?p[4]:DATA.wrong[j%DATA.wrong.length]}</p>${good?'':'<p>Review what learners need to demonstrate, then try another response.</p>'}</div>`}
function renderFinish(){const reported=scorm.complete();root.innerHTML=`<div class="success"><h2>Knowledge Check complete</h2><p>You have finished all four parts. Continue to the module discussion and Toolkit assignment.</p><p class="status" role="status">${scorm.available()?(reported?'Completion reported to the course player.':'Completion reporting was attempted. Return to Canvas and verify the assignment status.'):'This browser preview is not connected to Canvas. Complete the SCORM assignment in Canvas to record completion.'}</p><div class="actions"><button type="button" class="action secondary" id="restart">Practice again</button></div></div>`;root.querySelector('#restart').addEventListener('click',()=>{if(confirm('Start this practice again? Your previous Canvas completion will not be undone.')){state={step:0,picked:null,done:[false,false,false,false],attempts:[0,0,0,0]};save();render()}})}
render();</script></body></html>
